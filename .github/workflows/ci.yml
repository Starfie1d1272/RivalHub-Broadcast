name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.sha || github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    outputs:
      run_quality: ${{ steps.plan.outputs.run_quality }}
      run_acceptance: ${{ steps.plan.outputs.run_acceptance }}
      run_platform: ${{ steps.plan.outputs.run_platform }}
      run_qualification: ${{ steps.plan.outputs.run_qualification }}
      required_jobs: ${{ steps.plan.outputs.required_jobs }}
      reason: ${{ steps.plan.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Collect pull request changed paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff --name-status --find-renames "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-files.tsv"
          else
            : > "$RUNNER_TEMP/changed-files.tsv"
          fi

      - name: Plan changed-surface evidence
        id: plan
        run: node scripts/ci/plan.mjs
        env:
          CHANGED_FILES_FILE: ${{ runner.temp }}/changed-files.tsv

  quality:
    name: quality
    if: ${{ needs.plan.outputs.run_quality == 'true' }}
    needs: [plan]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24 and pnpm 12
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: 12.3.4
          runtime: node@24
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          require-lockfile: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Check architecture
        run: pnpm architecture:check

      - name: Verify checked-in CS2 assets
        run: pnpm cs2-assets:verify

      - name: Typecheck
        run: pnpm typecheck

      - name: Verify real-derived Program fixtures
        run: pnpm fixtures:program:verify

      - name: Verify real-derived Radar fixtures
        run: pnpm fixtures:radar:verify

      - name: Verify replay acceptance artifacts
        run: pnpm fixtures:replay:verify

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Production Web host smoke
        timeout-minutes: 2
        run: pnpm local-web:production-smoke

  acceptance:
    name: acceptance
    if: ${{ needs.plan.outputs.run_acceptance == 'true' }}
    needs: [plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24 and pnpm 12
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: 12.3.4
          runtime: node@24
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          require-lockfile: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run HUD Replay browser acceptance
        run: pnpm acceptance:test

      - name: Upload browser acceptance diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-acceptance-diagnostics
          path: |
            playwright-acceptance-report/**
            test-results/**
          if-no-files-found: warn

  platform:
    name: platform / ${{ matrix.name }}
    if: ${{ needs.plan.outputs.run_platform == 'true' }}
    needs: [plan]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-15
          - name: Windows
            runner: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24 and pnpm 12
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: 12.3.4
          runtime: node@24
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          require-lockfile: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check architecture
        run: pnpm architecture:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Production Web host smoke
        timeout-minutes: 2
        run: pnpm local-web:production-smoke

  qualification_windows:
    name: qualification / Windows bundle
    if: ${{ needs.plan.outputs.run_qualification == 'true' }}
    needs: [plan]
    runs-on: windows-2025
    env:
      QUALIFICATION_BUILD_ROOT: ${{ github.workspace }}/.agent-tmp/rivalhub-qualification-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js 24 and pnpm 12
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: 12.3.4
          runtime: node@24
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          require-lockfile: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore committed lockfile after Windows install
        shell: pwsh
        run: git checkout -- pnpm-lock.yaml

      - name: Build exact-SHA Windows qualification bundle
        run: node scripts/qualification/build.mjs --output "$env:QUALIFICATION_BUILD_ROOT"

      - name: Extract and smoke-test the portable bundle without CS2
        shell: pwsh
        run: |
          $archive = Get-ChildItem -LiteralPath $env:QUALIFICATION_BUILD_ROOT -Filter '*.zip' -File | Select-Object -First 1
          if ($null -eq $archive) { throw '未生成 qualification ZIP' }
          $extractRoot = Join-Path $env:RUNNER_TEMP 'qualification extracted path'
          if (Test-Path -LiteralPath $extractRoot) { Remove-Item -LiteralPath $extractRoot -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $extractRoot | Out-Null
          tar -xf $archive.FullName -C $extractRoot
          $bundleRoot = Get-ChildItem -LiteralPath $extractRoot -Directory | Select-Object -First 1
          if ($null -eq $bundleRoot) { throw '未能解压 qualification bundle 根目录' }
          $fakeSteamRoot = Join-Path $env:RUNNER_TEMP 'Steam root with spaces'
          $fakeSteamLibrary = Join-Path $env:RUNNER_TEMP 'CS2 library with spaces'
          New-Item -ItemType Directory -Force -Path (Join-Path $fakeSteamRoot 'steamapps') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $fakeSteamLibrary 'steamapps\common\Counter-Strike 2\game\csgo\cfg') | Out-Null
          $conflictingCfgPath = Join-Path $fakeSteamLibrary 'steamapps\common\Counter-Strike 2\game\csgo\cfg\gamestate_integration_other.cfg'
          Set-Content -LiteralPath $conflictingCfgPath -Value @(
            '"Other sender"'
            '{'
            '    "uri" "http://127.0.0.1:3000/"'
            '}'
          ) -Encoding ASCII
          $escapedLibraryPath = $fakeSteamLibrary.Replace('\', '\\')
          $libraryVdf = @(
            '"libraryfolders"'
            '{'
            '    "1"'
            '    {'
            ('        "path" "' + $escapedLibraryPath + '"')
            '    }'
            '}'
          ) -join [Environment]::NewLine
          Set-Content -LiteralPath (Join-Path $fakeSteamRoot 'steamapps\libraryfolders.vdf') -Value $libraryVdf -Encoding ASCII
          $env:STEAMROOT = $fakeSteamRoot
          Push-Location $bundleRoot.FullName
          try {
            $installOutput = & powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\install-gsi.ps1 2>&1 | Out-String
            Write-Output $installOutput
            if ($LASTEXITCODE -ne 0) { throw 'install-gsi.ps1 执行失败' }
            if ($installOutput -notmatch 'GSI 配置冲突') { throw '未输出 GSI 配置冲突预检警告' }
            & powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\start.ps1
            if ($LASTEXITCODE -ne 0) { throw 'start.ps1 执行失败' }
            $install = Get-Content -LiteralPath .\.qualification-local\install.json -Raw | ConvertFrom-Json
            $run = Get-Content -LiteralPath .\.qualification-local\run.json -Raw | ConvertFrom-Json
            $headers = @{ 'Content-Type' = 'application/json' }
            $assetManifest = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:3000/assets/cs2/manifest.json'
            if ($assetManifest.StatusCode -ne 200) { throw 'CS2 asset manifest HTTP smoke 失败' }
            if ($assetManifest.Headers['Content-Type'] -notmatch 'application/json') { throw 'CS2 asset manifest MIME 不正确' }
            $manifest = $assetManifest.Content | ConvertFrom-Json
            foreach ($asset in $manifest.assets.PSObject.Properties) {
              $assetResponse = Invoke-WebRequest -UseBasicParsing -Uri ('http://127.0.0.1:3000' + $asset.Value.outputPath)
              if ($assetResponse.StatusCode -ne 200) { throw ('CS2 SVG asset HTTP smoke 失败：' + $asset.Name) }
              if ($assetResponse.Headers['Content-Type'] -notmatch 'image/svg\+xml') { throw ('CS2 SVG MIME 不正确：' + $asset.Name) }
            }
            $payload = @{ auth = @{ token = [string]$install.gsiToken }; map = @{ name = 'de_nuke'; phase = 'live' }; round = @{ phase = 'freezetime' } } | ConvertTo-Json -Depth 10 -Compress
            Invoke-RestMethod -Method POST -Uri 'http://127.0.0.1:3000/gsi' -Headers $headers -Body $payload | Out-Null
            & powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\mark.ps1 demo-a-live
            if ($LASTEXITCODE -ne 0) { throw 'mark.ps1 demo-a-live 执行失败' }
            & powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\check.ps1
            if ($LASTEXITCODE -ne 0) { throw '首次 check.ps1 执行失败' }
            & powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\check.ps1 -WaitForStale -TimeoutSeconds 35
            if ($LASTEXITCODE -ne 0) { throw 'check.ps1 stale 轮询失败' }
            & powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\mark.ps1 cs2-closed
            if ($LASTEXITCODE -ne 0) { throw 'mark.ps1 cs2-closed 执行失败' }
            $controlHeaders = @{ 'x-qualification-token' = [string]$run.controlToken }
            Invoke-RestMethod -Method POST -Uri 'http://127.0.0.1:3000/qualification/next-map-execution' -Headers $controlHeaders -ContentType 'application/json' -Body '{}' | Out-Null
            & powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\mark.ps1 cs2-reopened
            $payload = @{ auth = @{ token = [string]$install.gsiToken }; map = @{ name = 'de_nuke'; phase = 'live' }; round = @{ phase = 'freezetime' } } | ConvertTo-Json -Depth 10 -Compress
            Invoke-RestMethod -Method POST -Uri 'http://127.0.0.1:3000/gsi' -Headers $headers -Body $payload | Out-Null
            & powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\mark.ps1 demo-b-live
            if ($LASTEXITCODE -ne 0) { throw 'mark.ps1 demo-b-live 执行失败' }
            & powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\stop.ps1
            if ($LASTEXITCODE -ne 0) { throw 'stop.ps1 执行失败' }
            $stateRoot = Join-Path $bundleRoot.FullName '.qualification-local'
            $cleanupDeadline = (Get-Date).AddSeconds(10)
            while ((Get-Date) -lt $cleanupDeadline -and (Test-Path -LiteralPath $stateRoot -PathType Container)) { Start-Sleep -Milliseconds 250 }
            if (Test-Path -LiteralPath $stateRoot -PathType Container) { throw 'supervisor 负责的 qualification 状态清理未完成' }
          } finally {
            Pop-Location
          }

      - name: Show Companion diagnostics on smoke failure
        if: ${{ failure() }}
        shell: pwsh
        run: |
          $extractedRoot = Join-Path $env:RUNNER_TEMP 'qualification extracted path'
          $logs = @(Get-ChildItem -LiteralPath $extractedRoot -Recurse -File -Include 'companion.log', 'companion.stderr.log', 'supervisor.log', 'supervisor.stderr.log' -ErrorAction SilentlyContinue)
          if ($logs.Count -eq 0) { Write-Output '未生成 Companion 日志。'; exit 0 }
          foreach ($log in $logs) {
            Write-Output "--- $($log.FullName)"
            Get-Content -LiteralPath $log.FullName
          }

      - name: Upload exact-SHA qualification artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rivalhub-broadcast-qualification-${{ github.event.pull_request.head.sha || github.sha }}-win-x64
          path: ${{ env.QUALIFICATION_BUILD_ROOT }}/*.zip
          if-no-files-found: error

  qualification_offline:
    name: qualification / offline / ${{ matrix.name }}
    if: ${{ github.event_name != 'pull_request' }}
    needs: [plan]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04
          - name: macOS
            runner: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24 and pnpm 12
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: 12.3.4
          runtime: node@24
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          require-lockfile: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run offline qualification
        run: pnpm qualification:offline

  ci-gate:
    name: ci-gate
    if: always()
    needs: [plan, quality, acceptance, platform, qualification_offline, qualification_windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate planner-selected jobs
        run: node scripts/ci/plan.mjs --gate
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          REQUIRED_JOBS: ${{ needs.plan.outputs.required_jobs }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          ACCEPTANCE_RESULT: ${{ needs.acceptance.result }}
          PLATFORM_RESULT: ${{ needs.platform.result }}
          QUALIFICATION_OFFLINE_RESULT: ${{ needs.qualification_offline.result }}
          QUALIFICATION_WINDOWS_RESULT: ${{ needs.qualification_windows.result }}
