name: Format debug

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24 and pnpm 12
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: 12.3.4
          runtime: node@24
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          require-lockfile: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Show Prettier rewrite
        shell: bash
        run: |
          pnpm exec prettier --write apps/web/src/program/widgets/player-rails/PlayerCard.tsx apps/web/src/program/widgets/player-rails/player-rails.css
          git diff -- apps/web/src/program/widgets/player-rails/PlayerCard.tsx apps/web/src/program/widgets/player-rails/player-rails.css
