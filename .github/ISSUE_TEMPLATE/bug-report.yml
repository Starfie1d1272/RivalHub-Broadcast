name: Bug report
description: Reproducible defect in current implemented behavior.
title: "[Bug] "
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What actually happened?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal reproducible steps, fixture/replay, logs, screenshots, or runtime context.
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Where was the defect observed?
      options:
        - macOS development
        - GitHub Actions macOS
        - GitHub Actions Windows
        - Real Windows
        - Windows + CS2
        - Windows + OBS
        - Windows + CS2 + OBS
        - Other / unknown
    validations:
      required: true

  - type: textarea
    id: environment_details
    attributes:
      label: Environment details
      description: OS version, CS2 build, OBS version, Browser Source context, commit SHA, runtime versions, or other relevant details.

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: User-facing, production, correctness, latency or reliability impact.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Relevant logs, session/epoch information, fixture names, commit SHA, screenshots, capture notes, etc.

  - type: textarea
    id: invariants
    attributes:
      label: Relevant invariants / suspected boundary
      description: If known, cite the affected ADR/package/lane. Do not guess if evidence is insufficient.

  - type: textarea
    id: validation
    attributes:
      label: Fix acceptance
      description: What regression test/replay and, if needed, real-environment evidence proves the bug is fixed?
    validations:
      required: true
